databases:
  - name: jalali-cosmetics-db
    databaseName: jalali_cosmetics
    user: jalali_admin
    plan: basic

services:
  # Django REST API
  - type: web
    name: jalali-cosmetics-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: jalali-cosmetics-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: jalali-cosmetics-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://jalali-cosmetics.onrender.com

  # Next.js Storefront
  - type: web
    name: jalali-cosmetics
    runtime: node
    plan: starter
    rootDir: apps/storefront
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SITE_NAME
        value: JALALI COSMETICS
      - key: NEXT_PUBLIC_API_URL
        value: https://jalali-cosmetics-api.onrender.com/api/v1
