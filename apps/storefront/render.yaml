services:
  - type: web
    name: jalali-cosmetics-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: jalali-cosmetics-api.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: jalali-cosmetics-db
          property: connectionString

  - type: web
    name: jalali-cosmetics-store
    runtime: node
    rootDir: apps/storefront
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NEXT_PUBLIC_API_URL
        value: https://jalali-cosmetics-api.onrender.com/api/store

databases:
  - name: jalali-cosmetics-db
    databaseName: jalali_cosmetics
    user: jalali_admin
